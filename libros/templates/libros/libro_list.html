{% extends 'libros/base.html' %}
{% block contenido %}
<h2>Libros</h2>
<a class="boton" href="{% url 'libro_create' %}">+ Nuevo libro</a>
<table>
    <tr>
        <th>Título</th><th>Año</th><th>Precio</th><th>Autor</th><th>Categoría</th><th>Acciones</th>
    </tr>
    {% for l in object_list %}
    <tr>
        <td>{{ l.titulo }}</td>
        <td>{{ l.anio }}</td>
        <td>${{ l.precio }}</td>
        <td>{{ l.autor }}</td>
        <td>{{ l.categoria }}</td>
        <td>
            <a href="{% url 'libro_update' l.pk %}">Editar</a>
            <a href="{% url 'libro_delete' l.pk %}">Eliminar</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
